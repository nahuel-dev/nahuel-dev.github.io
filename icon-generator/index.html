<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefox Extension Icon Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="import-container">
        <header class="import-header">
            <h1>Firefox Extension Icon Generator</h1>
        </header>

        <div class="import-content">
            <div class="drop-zone" id="dropZone">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h2>Drag and drop your image here</h2>
                <p>or click to select a file</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button id="selectFileBtn" class="select-btn">Select Image</button>
            </div>

            <div id="successMessage" class="success-message" style="display: none;">
                <svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <h3>Icons Generated Successfully!</h3>
                <p>Your icons are ready for download in the following sizes:</p>
                
                <div class="preview-grid" id="previewGrid"></div>
                
                <button id="downloadAllBtn" class="download-all-btn">Download All Icons (ZIP)</button>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;">
                <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <h3>Error</h3>
                <p id="errorText">Please select a valid image file.</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
